openapi: 3.0.3

info:
  title: WasaPhotoAPI Specification
  description: |
    This OpenAPI document describes the WasaPhoto project REST API.

    WasaPhoto is a social media platform that focuses on photo sharing.

  version: 1.0.0

servers:
  - url: "http://localhost:3000"
    description: localhost server for development

security:
  - bearerAuthentication: []

tags:
  - name: session
    description: Operations related to session management.

  - name: user
    description: Operations related to profile management and users' search.

  - name: block
    description: Operations related to the blocks handling.

  - name: follow
    description: Operations related to followers and following.

  - name: post
    description: Operations related to photos.

  - name: like
    description: Operations related to management of likes.

  - name: comment
    description: Operations related to management of comments.

  - name: settings
    description: Operations related to the user settings

#-----------------------------

paths:
  /login:
    post:
      tags: ["session"]
      operationId: doLogin
      summary: Logs in the user
      description: |-
        Returns the identifier of the requested user as a bearer token.
        Creates the user if it's not present in the database, then it returns the token.
      requestBody:
        description: User details
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Username" }
        required: true
      responses:
        "200":
          description: User logged in, returns the user identifier as token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserReduced" }
        "201":
          description: User created and logged in, returns the user identifier as token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserReduced" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /users/:
    parameters:
      - $ref: "#/components/parameters/UsernameQuery"

    get:
      tags: ["user"]
      operationId: searchUsers
      summary: Search the users in the database.
      description: |-
        Search the users in the database. 
        If a user has blocked the requested user, it will not be displayed.
      responses:
        "200":
          description: Returns the list of users according to the search criteria
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"

    get:
      tags: ["user"]
      operationId: getUserProfile
      summary: Returns the full profile of the requested user.
      description: |-
        Returns the full profile of the requested user.
        If a user has blocked the requested user, it will not be displayed.
      responses:
        "200":
          description: Returns the User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /users/{userId}/stream:
    parameters:
      - $ref: "#/components/parameters/UserId"

    get:
      tags: ["user"]
      operationId: getMyStream
      summary: Get the stream of posts on a page.
      description: |-
        Get the stream of posts on a page.
      responses:
        "200":
          description: Returns the user stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /settings/username:
    put:
      tags: ["settings"]
      operationId: setMyUserName
      summary: Update current username
      description: |-
        Update or set a new username
      requestBody:
        description: Fields to update in the current user's resource
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Username" }
      responses:
        "200":
          description: Username modified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserReduced" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /posts/:
    post:
      tags: ["post"]
      operationId: uploadPhoto
      summary: Upload a photo.
      description: |-
        Upload a photo.
      requestBody:
        content:
          multipart/form-data:
            schema:
              description: The photo to attach to the post.
              type: object
              properties:
                photo: { $ref: "#/components/schemas/Photo" }
                caption: { $ref: "#/components/schemas/Text" }
      responses:
        "201":
          description: Post created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/EntityTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"

    delete:
      tags: ["post"]
      operationId: deletePhoto
      summary: Remove a post.
      description: |-
        Remove a post.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /posts/{postId}/likes/self:
    parameters:
      - $ref: "#/components/parameters/PostId"

    get:
      tags: ["like"]
      operationId: getLikes
      summary: Gets the list of users that liked the post.
      description: |-
        Gets the list of user that liked the post. The user that blocked the requester will not be shown.
      responses:
        "200":
          description: Returns the list of users that liked the post.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    post:
      tags: ["like"]
      operationId: likePhoto
      summary: Like a post.
      description: |-
        Like a post.
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    delete:
      tags: ["like"]
      operationId: unlikePhoto
      summary: Unlike a post.
      description: |-
        Unlike a post.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /posts/{postId}/comments/:
    parameters:
      - $ref: "#/components/parameters/PostId"

    post:
      tags: ["comment"]
      operationId: commentPhoto
      summary: Comment a post.
      description: |-
        Comment a post.
      requestBody:
        description: Comment details
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
        required: true
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    get:
      tags: ["comment"]
      operationId: getComments
      summary: Gets the list of comments.
      description: |-
        Gets the list of comments. The user that blocked the requester will not be shown.
      responses:
        "200":
          description: Returns the list of comment related to the requested post.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /posts/{postId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/CommentId"

    delete:
      tags: ["comment"]
      operationId: uncommentPhoto
      summary: Uncomment a post.
      description: |-
        Uncomment a post.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /blocked/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"

    put:
      tags: ["block"]
      operationId: banUser
      summary: Blocks the requested user.
      description: |-
        Blocks the requested user.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: ["block"]
      operationId: unbanUser
      summary: Unlocks the requested user.
      description: |-
        Unlocks the requested user.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /blocked/:
    get:
      tags: ["block"]
      operationId: getBlockedList
      summary: Gets the list of blocked users.
      description: |-
        Gets the list of blocked users.
      responses:
        "200":
          description: Returns the list of the blocked users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /followers/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"

    get:
      tags: ["follow"]
      operationId: getFollowers
      summary: Gets the list of followers.
      description: |-
        Gets the list of followers. The user that blocked the requester will not be shown.
      responses:
        "200":
          description: Returns the list of the users that follows the logged user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /following/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"

    get:
      tags: ["follow"]
      operationId: getFollowingList
      summary: Gets the list of following.
      description: |-
        Gets the list of following. The user that blocked the requester will not be shown.
      responses:
        "200":
          description: Returns the list of the users that the logged user follows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    put:
      tags: ["follow"]
      operationId: followUser
      summary: Follows a user.
      description: |-
        Follows the user specified with the UserId.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

    delete:
      tags: ["follow"]
      operationId: unfollowUser
      summary: Unfollows a user.
      description: |-
        Unfollows the user specified with the UserId.
      responses:
        "204": { $ref: "#/components/responses/NoContent" } #unfollowed the user
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

#-----------------------------

components:
  securitySchemes:
    bearerAuthentication:
      description: |
        User token that uses the entityId of the logged user.
        Done accordingly to the project specification
      type: http
      scheme: bearer

  schemas:
    User:
      description: |
        The Users entity. Applies to current and requested users.
      type: object
      properties:
        userId:
          type: integer
          example: 1
          description: userId
        username:
          type: string
          example: "Username"
          description: the username
        numberOfFollowers:
          type: integer
          example: 0
          description: followers
        accountsFollowed:
          type: integer
          example: 0
          description: following
        numberOfPosts:
          type: integer
          example: 0
          description: number of posts
        isBlocked:
          type: boolean
          example: false
          description: is the user blocked?
        isFollowed:
          type: boolean
          example: false
          description: do you follow the user?

    UserReduced:
      description: |
        The Users entity with only the essential properties.
      type: object
      properties:
        userId:
          type: integer
          example: 1
          description: userId
        username:
          type: string
          example: "Username"
          description: the full username

    UserList:
      description: List of Users
      type: array
      minItems: 0
      maxItems: 100
      items:
        $ref: "#/components/schemas/UserReduced"

    Username:
      description: |
        The username, for searching.
      type: object
      properties:
        username:
          type: string
          example: User
          pattern: '^[a-zA-Z][\.]{0,1}([\w][\.]{0,1})*[\w]$'
          minLength: 3
          maxLength: 25
          description: username pattern

    Post:
      description: |
        The Post entity.
      type: object
      properties:
        postId:
          type: integer
          example: 1
          description: postId
        authorId:
          type: integer
          example: 1
          description: the user who posted
        caption:
          type: string
          example: "My post"
          description: the text under the post
        numberOfLikes:
          type: integer
          example: 0
          description: quantity of likes
        numberOfComments:
          type: integer
          example: 0
          description: quantity od comments
        timeOfCreation:
          type: string
          example: "2002-01-11T18:45:54.215500172Z"
          description: time of creation of the post
        isliked:
          type: boolean
          example: false
          description: is the post liked? hmmm...

    Stream:
      description: List of posts
      type: array
      minItems: 0
      maxItems: 100
      items:
        $ref: "#/components/schemas/Post"

    Photo:
      description: Photo to upload/download, as binary file
      type: string
      format: binary
      pattern: "^[01]+$"
      minLength: 4096 # 4kB
      maxLength: 10485760 # 10MB

    Text:
      description: Generic text. All user-inserted text-blocks will have this format.
      type: string
      example: A beautiful sunset!
      pattern: ".*"
      minLength: 1
      maxLength: 255

    Comment:
      description: A comment structure with Text, PostId and UserId.
      type: object
      properties:
        postId:
          type: integer
          example: 1
          description: postId
        userId:
          type: integer
          example: 1
          description: userId
        text:
          type: string
          pattern: ".*"
          example: A beautiful sunset!
          description: the text to include in the comment

    CommentList:
      description: List of comments
      type: array
      minItems: 0
      maxItems: 100
      items:
        $ref: "#/components/schemas/Comment"

    CommentRequest:
      description: comment request
      type: object
      properties:
        text:
          $ref: "#/components/schemas/Text"

  parameters:
    UsernameQuery:
      in: query
      name: username
      description: Value of the search box for searching the users by username.
      schema:
        type: string
        example: User
        pattern: '^[a-zA-Z][\.]{0,1}([\w][\.]{0,1})*[\w]$'
        minLength: 3
        maxLength: 25
      required: true

    UserId:
      in: path
      name: userId
      description: The EntityId of the requested user.
      schema:
        type: integer
        example: 1
        maximum: 18446744073709551615
        minimum: 0
      required: true

    PostId:
      in: path
      name: postId
      description: The EntityId of the post.
      schema:
        type: integer
        example: 1
        maximum: 18446744073709551615
        minimum: 0
      required: true

    CommentId:
      in: path
      name: commentId
      description: The EntityId of the comment.
      schema:
        type: integer
        example: 1
        maximum: 18446744073709551615
        minimum: 0
      required: true

  responses:
    Created:
      description: The requested entity has been created
      content:
        application/json:
          schema:
            description: returned success string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "Content created"
    NoContent:
      description: The request ended successfully with no body
    Unauthorized:
      description: The access token is missing or it's expired
      content:
        application/json:
          schema:
            description: returned access denied string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "The user is not authorized"
    BadRequest:
      description: The request was not compliant with the documentation (eg. missing fields, etc)
      content:
        application/json:
          schema:
            description: returned bad request string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "Request is not compliant with the documentation"
    InternalServerError:
      description: The server encountered an internal error. Further info in server logs.
      content:
        application/json:
          schema:
            description: returned error string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "Internal server error"
    NotFound:
      description: The requested entity is not found.
      content:
        application/json:
          schema:
            description: returned error string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "Content not found"
    Forbidden:
      description: The operation is forbidden by the server.
      content:
        application/json:
          schema:
            description: returned forbidden string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "Operation is forbidden"
    EntityTooLarge:
      description: The provided file is too large.
      content:
        application/json:
          schema:
            description: returned file error string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "The file is too large"
    UnsupportedMediaType:
      description: The file type is unsupported. Provide a jpg or png file.
      content:
        application/json:
          schema:
            description: returned file error string
            type: string
            minLength: 0
            maxLength: 60
            pattern: ^[\S\s]{0,60}$ #(.*?)
            example: "The file type is unsupported"
